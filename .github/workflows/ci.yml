name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Isolated trace sessions, which the tests expect, need OTP 27+.
        otp: ["27", "28"]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: "1.19"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      # Yaws, a test dependency, compiles a PAM driver.
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  tls:
    name: Tests over TLS distribution
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-28-${{ hashFiles('mix.lock') }}
      # Yaws, a test dependency, compiles a PAM driver.
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: mix deps.get
      - run: mix compile
      # Every node, the tests' and the peers' (through ERL_FLAGS), uses TLS.
      - run: |
          CONF=$(scripts/tls_dist_certs.sh "$RUNNER_TEMP/tls")
          ERL_FLAGS="-proto_dist inet_tls -ssl_dist_optfile $CONF" mix test

  old-otp:
    name: OTP 26 target
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-28-${{ hashFiles('mix.lock') }}
      # Yaws, a test dependency, compiles a PAM driver.
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: mix deps.get
      - run: mix compile
      # The target listens on a fixed distribution port, published from the
      # container; the tests connect to it without epmd and without listening.
      - name: Start an OTP 26 target
        run: |
          docker run -d --name otp26 -p 9100:9100 erlang:26-slim \
            erl -noinput -name old@127.0.0.1 -setcookie testcookie -erl_epmd_port 9100 \
            -eval 'spawn(fun() -> timer:apply_interval(100, queue, new, []), receive after infinity -> ok end end).'
          sleep 5
      - run: mix test --only old_otp
        env:
          OLD_OTP_NODE: old@127.0.0.1
          OLD_OTP_COOKIE: testcookie
          ERL_FLAGS: -erl_epmd_port 9100 -dist_listen false
      - name: Target log
        if: always()
        run: docker logs otp26

  new-otp:
    name: OTP 29 target
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-28-${{ hashFiles('mix.lock') }}
      # Yaws, a test dependency, compiles a PAM driver.
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: mix deps.get
      - run: mix compile
      # A newer OTP than the tool's: its .beam files need its own disassembler.
      - name: Start an OTP 29 target
        run: |
          docker run -d --name otp29 -p 9101:9101 erlang:29-slim \
            erl -noinput -name new@127.0.0.1 -setcookie testcookie -erl_epmd_port 9101 \
            -eval 'spawn(fun() -> timer:apply_interval(100, queue, new, []), receive after infinity -> ok end end).'
          sleep 5
      - run: mix test --only new_otp
        env:
          NEW_OTP_NODE: new@127.0.0.1
          NEW_OTP_COOKIE: testcookie
          ERL_FLAGS: -erl_epmd_port 9101 -dist_listen false
      - name: Target log
        if: always()
        run: docker logs otp29

  release:
    name: Release over MCP stdio
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          gleam-version: "1.19.2"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-prod-28-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --only prod
      - run: mix release --overwrite
      - name: Smoke test against the Elixir demo node
        run: |
          examples/elixir/run.sh shop
          sleep 3
          python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "shop_ex@$(hostname -s)" Shop.PriceCache
      - name: Smoke test against the Erlang demo node
        run: |
          examples/erlang/run.sh shop
          sleep 3
          python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "shop_erl@$(hostname -s)" price_cache
      - name: Smoke test against the native (C NIF) demo node
        run: |
          examples/erlang/run.sh native
          sleep 3
          python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "native_erl@$(hostname -s)" native_nif
      - name: Smoke test against the ports demo node
        run: |
          examples/erlang/run.sh ports
          sleep 3
          python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "ports_erl@$(hostname -s)" ports_shop
      - name: Smoke test against the orders demo node, and the crash demo's dump
        run: |
          examples/erlang/run.sh orders
          examples/erlang/run.sh crash
          # crash_erl dies within a minute; its dump is done when it's gone.
          for i in $(seq 1 60); do
            pgrep -f "sname crash_erl" >/dev/null || break
            sleep 2
          done
          SMOKE_EXPECT_CRASH=orders_importer \
          SMOKE_CRASH_DUMP="$PWD/examples/erlang/dumps/crash_erl.dump" SMOKE_CRASH_CAUSE=out_of_memory \
            python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "orders_erl@$(hostname -s)" orders_payments
      - name: Smoke test against the locks demo node
        run: |
          examples/erlang/run.sh locks
          sleep 8
          SMOKE_EXPECT_CRITICAL=call_chains \
            python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "locks_erl@$(hostname -s)" locks_shop
      - name: Smoke test against the deploy and dist demo nodes
        run: |
          examples/erlang/run.sh deploy
          examples/erlang/run.sh dist
          sleep 3
          SMOKE_EXPECT_WARNING=stale_code \
            python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "deploy_erl@$(hostname -s)" discounts
          python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "dist_a@$(hostname -s)" dist_shop
      - name: Smoke test against the Gleam demo node
        run: |
          examples/gleam/run.sh shop
          sleep 3
          python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "shop_gleam@$(hostname -s)" shop
      - name: Smoke test against the LFE demo node
        run: |
          git clone -q --depth 1 --branch v2.2.2 https://github.com/lfe/lfe.git "$RUNNER_TEMP/lfe"
          make -C "$RUNNER_TEMP/lfe" compile
          LFE="$RUNNER_TEMP/lfe" examples/lfe/run.sh shop
          sleep 3
          python3 scripts/mcp_smoke.py _build/prod/rel/otp_debug_mcp/bin/otp_debug_mcp \
            "shop_lfe@$(hostname -s)" price-cache
