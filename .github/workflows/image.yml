name: Image

# Build the Docker image of a published release for linux/amd64 and
# linux/arm64, smoke-test it against a node in another container, and push
# it to ghcr.io. The Release workflow calls it after publishing a release;
# run it by hand (gh workflow run Image -f version=0.4.0) for an earlier one.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.4.0"
        required: true
        type: string

jobs:
  image:
    name: Build, test and push the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # A v-prefixed tag works too, and only the newest release is latest.
      - name: Tags
        id: tags
        run: |
          vsn="${INPUT_VERSION#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          newest=$(gh release view --json tagName --jq .tagName)
          tags="$image:$vsn"
          if [ "$newest" = "v$vsn" ]; then tags="$tags,$image:latest"; fi
          echo "vsn=$vsn" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VSN=${{ steps.tags.outputs.vsn }}
          load: true
          tags: otp-debug-mcp:test

      - name: Smoke test against a node in another container
        run: |
          docker run -d --name shop -v "$PWD/examples/erlang:/demo:ro" erlang:28-slim sh -c \
            "mkdir -p /tmp/ebin && erlc -o /tmp/ebin /demo/src/price_cache.erl && exec erl -sname shop -setcookie smoke -pa /tmp/ebin -noshell -eval 'price_cache:start()'"
          sleep 5
          printf '#!/bin/sh\nexec docker run -i --rm --network container:shop -e OTP_DEBUG_MCP_COOKIE otp-debug-mcp:test "$@"\n' > server.sh
          chmod +x server.sh
          OTP_DEBUG_MCP_COOKIE=smoke python3 scripts/mcp_smoke.py ./server.sh "shop@$(docker exec shop hostname)" price_cache

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build for both architectures and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VSN=${{ steps.tags.outputs.vsn }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
